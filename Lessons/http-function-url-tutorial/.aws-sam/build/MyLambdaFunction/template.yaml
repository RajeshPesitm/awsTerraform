AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  MyLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs20.x
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: GET